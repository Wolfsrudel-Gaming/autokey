name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/AutoKey/AutoKey.csproj -c Release

      - name: Upload AutoKey.exe
        uses: actions/upload-artifact@v4
        with:
          name: AutoKey
          path: src/AutoKey/bin/Release/net48/AutoKey.exe

      - name: Create release (bei Tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" src/AutoKey/bin/Release/net48/AutoKey.exe
          --title "AutoKey $GITHUB_REF_NAME" --generate-notes
